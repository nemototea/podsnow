plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.nemotea.podsnow.audioengine'
version = '0.1.0'

android {
  namespace "dev.nemotea.podsnow.audioengine"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // DSP（Mixer / Loudness）の JVM 単体テスト。org.json は Android の実装が JVM に無いので本物を入れる
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
}
