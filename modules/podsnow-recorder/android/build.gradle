plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.nemotea.podsnow.recorder'
version = '0.1.0'

android {
  namespace "dev.nemotea.podsnow.recorder"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
}
